<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ページ</title>
    <link rel="icon" href="images/soillab_square.png">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="admin-container">

    <h1>管理者ページ</h1>

    <button id="logoutBtn" class="btn-primary">
        ログアウト
    </button>

    <p class="admin-subtitle">
        投稿管理・活動編集
    </p>

    <div class="admin-layout">

        <!-- 左側 -->
        <div class="left-panel">

            <div class="card">
                <h2>活動投稿</h2>

                <input
                    type="text"
                    id="activityTitle"
                    class="form-control"
                    placeholder="活動タイトル"
                >

                <textarea
                    id="activityEditor"
                    class="form-control textarea"
                    placeholder="活動内容を入力してください"
                ></textarea>

                <div class="editor-toolbar">
                    <input type="file" id="editorImage" accept="image/*" hidden>

                    <button type="button" id="imageInsertBtn" class="file-btn">
                        画像を挿入
                    </button>

                    <input type="number" id="imgWidth" class="image-size-input" value="350" placeholder="横幅">
                    <input type="number" id="imgHeight" class="image-size-input" placeholder="高さ">
                </div>

                <select id="imageLayout" class="image-size-input">
                    <option value="single">1枚ずつ</option>
                    <option value="row">横並び</option>
                </select>



                <button id="postActivity" class="btn-primary">
                    投稿する
                </button>
            </div>

            <div class="card">
                <h2>投稿一覧</h2>

                <div id="activityList">
                    <p>まだ投稿はありません</p>
                </div>
            </div>

        </div>

        <!-- 右側 -->
        <div class="right-panel">

            <div class="card">
                <h2>外部管理</h2>

                <a 
                    href="https://cloud.mongodb.com/v2/69fcc16851d24c97bf2a7e93#/overview"
                    target="_blank"
                    class="external-link-btn"
                >
                    MongoDB
                </a>

                <a 
                    href="https://github.com/"
                    target="_blank"
                    class="external-link-btn"
                >
                    GitHub
                </a>


            </div>

        </div>

    </div>

</div>

<div id="successModal" class="modal">
    <div class="modal-content">
        <h2>投稿完了</h2>
        <p id="successText">投稿成功</p>

        <div class="modal-buttons">
            <button id="closeSuccessModal" class="delete-cancel">
                OK
            </button>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h2>削除確認</h2>
        <p>この投稿を削除してもよろしいですか？</p>

        <div class="modal-buttons">
            <button id="confirmDelete" class="delete-confirm">
                削除する
            </button>

            <button id="cancelDelete" class="delete-cancel">
                キャンセル
            </button>
        </div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
