<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <link rel="icon" href="images/soillab_square.png">
    <link rel="stylesheet" href="sinki.css">
</head>

<body>

<div class="login">
    <div class="register-form">
        <h2>新規登録</h2>

        <!-- 姓名 -->
        <div class="form-group">
            <label class="form-label">氏名</label>
            <input type="text" id="name" class="form-control" placeholder="阪南 太郎">
        </div>

        <div class="form-group">
            <label class="form-label">学年</label>
            <select id="grade" class="form-control">
                <option value="">選択してください</option>
                <option value="2年">2回</option>
                <option value="3年">3回</option>
                <option value="4年">4回</option>
            </select>
        </div>


        <!-- 学部 -->
        <div class="form-group">
            <label class="form-label">学部</label>
            <select id="faculty" class="form-control">
                <option value="">選択してください</option>
                <option value="国際学部">国際学部　国際コミュニケーション学科</option>
                <option value="国際学部">国際学部　国際観光学科</option>
                <option value="経済学部">経済学部　経済学科</option>
                <option value="経営学部">経営学部　経営学科</option>
                <option value="総合情報学部">総合情報学部　総合情報学科</option>
            </select>
        </div>
        

        <!-- メール -->
        <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
        </div>

        <!-- パスワード -->
    <div class="form-group">

        <label class="form-label">
            パスワード
        </label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="パスワード"
            >

            <button
                type="button"
                id="togglePassword"
                class="show-password">
                表示
            </button>

        </div>
    
</div>


<div class="form-group">

    <label class="form-label">
        パスワード（確認用）
    </label>

    <div class="password-box">

        <input
            type="password"
            id="password1"
            class="form-control"
            placeholder="パスワード"
        >

        <button
            type="button"
            id="togglePassword1"
            class="show-password">
            表示
        </button>

    </div>
</div>

    <!-- 登録ボタン -->
    <button id="registerBtn" class="btn-login">登録</button>

    <div class="forgot-password">
        <a href="suedazemi login.html">ログインはこちら</a>
    </div>

    <p id="errorMessage"></p>

</div>

<script src="register.js"></script>

</div>
</body>
</html>
