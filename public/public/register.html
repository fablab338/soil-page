<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <link rel="icon" href="images/soillab_square.png">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login">

    <h2>新規登録</h2>

    <form id="registerForm">

        <div class="form-group">

            <label class="form-label">
                氏名
            </label>

            <input
                type="text"
                id="name"
                class="form-control"
                required
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                学部
            </label>

            <select
                id="faculty"
                class="form-control"
            >

                <option value="経営学部">
                    経営学部
                </option>

                <option value="経済学部">
                    経済学部
                </option>

            </select>

        </div>


        <div class="form-group">

            <label class="form-label">
                学年
            </label>

            <select
                id="grade"
                class="form-control"
            >

                <option value="1年">
                    1回
                </option>

                <option value="2年">
                    2回
                </option>

                <option value="3年">
                    3回
                </option>

                <option value="4年">
                    4回
                </option>

            </select>

        </div>


        <div class="form-group">

            <label class="form-label">
                メールアドレス
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                required
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                required
            >

        </div>


        <button
            type="submit"
            class="btn-login"
        >
            登録
        </button>

        <p id="message"></p>

    </form>

</div>

<script src="register.js"></script>

</body>
</html>
