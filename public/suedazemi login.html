<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>末田ゼミ研究室 SOIL</title>
    <link rel="icon" href="images/soillab_square.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login">


    <form id="loginForm">

        <!-- メール -->
        <div class="form-group">

            <label
                for="email"
                class="form-label">
                メールアドレス
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="your@email.com"
                required
            >

        </div>


        <!-- パスワード / OTP -->
        <div class="form-group">

            <label
                for="password"
                class="form-label">
                パスワード 
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="パスワード"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="show-password">
                    表示
                </button>

            </div>
        </div>

        <!-- ログイン -->
        <button
            type="submit"
            class="btn-login">
            ログイン
        </button>


        <!-- エラー -->
        <p id="errorMessage"></p>


        <!-- パスワード忘れ -->
        <div class="forgot-password">

            <a href="forgot-password.html" id="forgotLink">
                パスワードを忘れた方はこちら
            </a>

        </div>


        <!-- 新規登録 -->
        <div class="register">

            <p>
                アカウントをお持ちでない方
            </p>

            <a
                href="sinki.html"
                class="btn-register">
                新規登録
            </a>

        </div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
