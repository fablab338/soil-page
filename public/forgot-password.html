<!DOCTYPE html>
<html lang="ja">
    <head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>末田ゼミ研究室</title>
    <link rel="icon" href="images/soillab_square.png">
    <link rel="stylesheet" href="sinki.css">
</head>



<body>
<div class="login">
    <div class="register-form">

    <h2>パスワード再設定</h2>

    <p class="reset-text">
        登録した氏名とメールアドレスを入力してください。
        確認後、パスワード再設定用メールを送信します。
    </p>

    <!-- 氏名 -->
    <div class="form-group">
        <label class="form-label">
            氏名
        </label>

        <input
            type="text"
            id="name"
            class="form-control"
            placeholder="阪南太郎"
        >
    </div>

    <!-- メール -->
    <div class="form-group">
        <label class="form-label">
            メールアドレス
        </label>

        <input
            type="email"
            id="email"
            class="form-control"
            placeholder="example@gmail.com"
        >
    </div>

    <!-- 送信 -->
    <button
        id="resetBtn"
        class="btn-login">
        再設定メール送信
    </button>

    <div class="forgot-password">
        <a href="suedazemi login.html">ログインはこちら</a>
    </div>

    </div>
</div>

<script src="password.js"></script>

</body>
</html>
